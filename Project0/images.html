<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Search Images</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="reset.css" />
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="advance.html">Advanced Search</a>
            </nav>
        </header>
        <div class="formContainer">
            <div class="logo">
                <img src="googlelogo_light_color_272x92dp.png" />
                <span class="logotext">images</span>
            </div>
            
            <form
                action="https://www.google.com/search"
                target="_blank"
                id="imageForm"
            >
                <div class="searchField">
                    <svg width="20px" height="20px" viewBox="0 -0.5 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M5.5 10.7655C5.50003 8.01511 7.44296 5.64777 10.1405 5.1113C12.8381 4.57483 15.539 6.01866 16.5913 8.55977C17.6437 11.1009 16.7544 14.0315 14.4674 15.5593C12.1804 17.0871 9.13257 16.7866 7.188 14.8415C6.10716 13.7604 5.49998 12.2942 5.5 10.7655Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17.029 16.5295L19.5 19.0005" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="text" name="q" id="" />
                    <input type="hidden" name="udm" value="2" />
                </div>
                <div class="buttonsField">
                    <input type="submit" value="Google Search" />
                </div>
            </form>
        </div>
    </body>
</html>
